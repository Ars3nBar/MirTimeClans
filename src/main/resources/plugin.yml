name: MirTimeClans
version: '2.0.0'
main: ru.mirtime.clans.MirTimeClans
api-version: '1.21'
softdepend:
  - Vault
  - PlaceholderAPI
commands:
  clan:
    description: Управление кланом Mir-Time
    aliases: [clans, клан, к]
  c:
    description: Написать сообщение в клановый чат
    aliases: [clanchat, кч]
  cc:
    description: Переключить постоянный режим кланового чата
permissions:
  mirtime.clans.admin:
    description: Административное управление кланами
    default: op
